name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests (Vitest)
        run: npm test

      - name: Build Vue app (Vite)
        run: npm run build --workspace=apps/simulator-vue

      - name: Add CNAME for custom domain (if present)
        run: |
          if [ -f CNAME ]; then
            cp CNAME apps/simulator-vue/dist/CNAME
          fi

      # Repo currently publishes Pages from branch "gh-pages" (legacy Pages settings).
      # Deploy by pushing the built artifact to that branch.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/simulator-vue/dist
          force_orphan: true
